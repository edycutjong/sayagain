<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SayAgain — a lockout tag carrying an instruction and its read-back; the one field that differs is blocked in red">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--panel, #303435)"/>
      <stop offset="100%" stop-color="var(--bg, #272A2B)"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- the danger tag: chamfered top corners, rim so it reads on GitHub light AND dark -->
  <path d="M132 40 H380 L456 116 V444 Q456 472 428 472 H84 Q56 472 56 444 V116 Z"
        fill="url(#plate)" stroke="var(--before, #A9AEA6)" stroke-width="14" stroke-linejoin="round" filter="url(#lift)"/>
  <!-- grommet hole -->
  <circle cx="256" cy="122" r="34" fill="#1E2122" stroke="var(--ink, #ECE6D6)" stroke-width="12"/>
  <!-- instruction line: action · tag · line, all grey -->
  <g fill="var(--before, #A9AEA6)">
    <rect x="104" y="214" width="78"  height="40" rx="6"/>
    <rect x="200" y="214" width="112" height="40" rx="6"/>
    <rect x="330" y="214" width="78"  height="40" rx="6"/>
  </g>
  <!-- joins: two fields agree, one does not -->
  <g stroke-width="10" stroke-linecap="round">
    <line x1="143" y1="270" x2="143" y2="314" stroke="var(--before, #A9AEA6)"/>
    <line x1="256" y1="270" x2="256" y2="314" stroke="var(--before, #A9AEA6)"/>
    <line x1="369" y1="270" x2="369" y2="300" stroke="var(--after, #E23B2E)" stroke-dasharray="8 10"/>
  </g>
  <!-- read-back line: the third field is the wrong word -->
  <g fill="var(--before, #A9AEA6)">
    <rect x="104" y="330" width="78"  height="40" rx="6"/>
    <rect x="200" y="330" width="112" height="40" rx="6"/>
  </g>
  <rect x="324" y="308" width="92" height="84" rx="8" fill="var(--after, #E23B2E)"/>
  <!-- waveform tick under the read-back -->
  <g fill="var(--muted, #8F938C)">
    <rect x="104" y="406" width="10" height="20" rx="3"/><rect x="124" y="400" width="10" height="32" rx="3"/>
    <rect x="144" y="410" width="10" height="12" rx="3"/><rect x="164" y="398" width="10" height="36" rx="3"/>
    <rect x="184" y="406" width="10" height="20" rx="3"/><rect x="204" y="402" width="10" height="28" rx="3"/>
    <rect x="224" y="410" width="10" height="12" rx="3"/><rect x="244" y="404" width="10" height="24" rx="3"/>
    <rect x="264" y="400" width="10" height="32" rx="3"/><rect x="284" y="408" width="10" height="16" rx="3"/>
  </g>
</svg>
