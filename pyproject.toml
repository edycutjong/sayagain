[project]
name = "sayagain"
version = "0.1.0"
description = "Checks every radio read-back of a safety instruction and sends the wrong ones to a human."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://sayagain.edycu.dev/"
Replay = "https://sayagain.edycu.dev/replay/"
Pitch = "https://sayagain.edycu.dev/pitch/"
Repository = "https://github.com/edycutjong/sayagain"

[project.optional-dependencies]
# local Whisper for the kill test only (Mac / CPU); never on the judged path
killtest = [
    "torch>=2.3",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
branch = false
source = ["referee", "sayagain", "scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 100
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
